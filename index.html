<!DOCTYPE html>>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <title> 퍼즐 이벤트 </title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>퍼즐을 맞춰봐</h1>

        <div class="puzzle-board">
            <div class="puzzle-slot" id="slot-1"></div>
            <div class="puzzle-slot" id="slot-2"></div>
            <div class="puzzle-slot" id="slot-3"></div>
            <div class="puzzle-slot" id="slot-4"></div>
            <div class="puzzle-slot" id="slot-5"></div>
            <div class="puzzle-slot" id="slot-6"></div>
            <div class="puzzle-slot" id="slot-7"></div>
            <div class="puzzle-slot" id="slot-8"></div>
            <div class="puzzle-slot" id="slot-9"></div>
        </div>

        <div class="piece-box">
            <div class="piece1" id="piece1" draggable="true"></div>
            <div class="piece2" id="piece2" draggable="true"></div>
            <div class="piece3" id="piece3" draggable="true"></div>
            <div class="piece4" id="piece4" draggable="true"></div>
            <div class="piece5" id="piece5" draggable="true"></div>
            <div class="piece6" id="piece6" draggable="true"></div>
            <div class="piece7" id="piece7" draggable="true"></div>
            <div class="piece8" id="piece8" draggable="true"></div>
            <div class="piece9" id="piece9" draggable="true"></div>
        </div>


        <div id="success-message" style="display: none;">
            

        </div>

        <button id="next-button" style="display: none;">넘어가기</button>
        <script src="script.js"></script>
    </body>
</html>
